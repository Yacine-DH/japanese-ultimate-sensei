<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japanese Ultimate Sensei — Settings</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
      }
      .card {
        width: 100%;
        max-width: 540px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.35rem;
      }
      p.sub {
        margin: 0 0 20px;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: #e2e8f0;
      }
      input[type='text'],
      input[type='password'],
      input[type='number'],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
        font-size: 0.925rem;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .checkbox-row input {
        width: 18px;
        height: 18px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button.primary {
        background: #38bdf8;
        color: #0f172a;
      }
      button.secondary {
        background: #334155;
        color: #f8fafc;
      }
      .status {
        margin-top: 14px;
        font-size: 0.875rem;
        padding: 10px 12px;
        border-radius: 8px;
        display: none;
      }
      .status.ok {
        display: block;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid #22c55e;
        color: #86efac;
      }
      .status.err {
        display: block;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Japanese Ultimate Sensei</h1>
      <p class="sub">Extension Options — Server, Dictionary &amp; Subtitle Preferences</p>
      <form id="settings-form">
        <div class="field">
          <label for="server-url">Server URL</label>
          <input
            id="server-url"
            type="text"
            placeholder="http://<tailscale-host>:8000"
            required
          />
        </div>
        <div class="field">
          <label for="api-token">API Token (SENSEI_API_TOKEN)</label>
          <input
            id="api-token"
            type="password"
            placeholder="Leave empty if server auth is disabled"
          />
        </div>
        <div class="field">
          <label for="gloss-lang">Dictionary Gloss Language</label>
          <select id="gloss-lang">
            <option value="eng">English (EN)</option>
            <option value="ger">German (DE)</option>
          </select>
        </div>
        <div class="field">
          <label for="highlight-limit">Highlighted Unknown Words per Line</label>
          <input id="highlight-limit" type="number" min="0" max="20" step="1" />
        </div>
        <div class="field">
          <label for="hover-delay">Hover Intent Delay (ms)</label>
          <input id="hover-delay" type="number" min="0" max="2000" step="25" />
        </div>
        <div class="field">
          <label class="checkbox-row">
            <input id="pause-on-hover-toggle" type="checkbox" />
            <span>Pause video while hovering a word</span>
          </label>
        </div>
        <div class="field">
          <label class="checkbox-row">
            <input id="shift-hover-toggle" type="checkbox" />
            <span>Require holding Shift to open dictionary on hover (Yomitan-style)</span>
          </label>
        </div>
        <div class="field">
          <label class="checkbox-row">
            <input id="romaji-toggle" type="checkbox" />
            <span>Show Romaji line below Japanese subtitles</span>
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="primary">Save Settings</button>
          <button type="button" id="test-btn" class="secondary">Test /health</button>
        </div>
        <div id="status-box" class="status"></div>
      </form>
    </div>
    <div class="card" style="margin-top: 20px">
      <h1 style="font-size: 1.1rem">Hotkeys</h1>
      <p class="sub">
        Keys are matched by physical position, so they work the same on QWERTZ and QWERTY.
        Click a key, then press the new combination (Esc cancels). Saved immediately.
      </p>
      <div id="hotkey-list"></div>
      <div class="actions">
        <button type="button" id="hotkey-reset-btn" class="secondary">Reset to defaults</button>
      </div>
      <div id="hotkey-status" class="status"></div>
    </div>
    <style>
      .hotkey-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #334155;
        font-size: 0.9rem;
      }
      .hotkey-row button {
        min-width: 110px;
        font-family: ui-monospace, monospace;
        background: #0f172a;
        color: #7dd3fc;
        border: 1px solid #475569;
      }
      .hotkey-row button.recording {
        border-color: #f59e0b;
        color: #fbbf24;
      }
      .hotkey-row button.conflict {
        border-color: #ef4444;
        color: #fca5a5;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
