<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japanese Ultimate Sensei</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        width: 350px;
        padding: 14px;
        background: #0f172a;
        color: #f8fafc;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: 1rem;
      }
      .badge {
        font-size: 0.72rem;
        padding: 3px 8px;
        border-radius: 999px;
        font-weight: 600;
      }
      .badge.online {
        background: rgba(34, 197, 94, 0.2);
        color: #86efac;
        border: 1px solid #22c55e;
      }
      .badge.offline {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border: 1px solid #ef4444;
      }
      .panel {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        font-size: 0.8rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      .muted {
        color: #94a3b8;
      }
      .pattern-pill {
        font-family: monospace;
        font-size: 0.72rem;
        color: #7dd3fc;
        background: #0f172a;
        padding: 3px 6px;
        border-radius: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 210px;
      }
      label {
        display: block;
        font-size: 0.78rem;
        color: #cbd5e1;
        margin-bottom: 4px;
        font-weight: 600;
      }
      input[type='text'],
      input[type='number'],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
        margin-bottom: 8px;
        font-size: 0.8rem;
      }
      input[type='file'] {
        width: 100%;
        font-size: 0.75rem;
        margin-bottom: 8px;
        color: #cbd5e1;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #334155;
      }
      .suggest-banner {
        display: none;
        background: rgba(56, 189, 248, 0.14);
        border: 1px solid #38bdf8;
        border-radius: 6px;
        padding: 7px 9px;
        margin-bottom: 8px;
      }
      .suggest-banner.visible {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      button {
        width: 100%;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #334155;
        color: #f8fafc;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.8rem;
      }
      button.primary {
        background: #38bdf8;
        color: #0f172a;
        border-color: #38bdf8;
      }
      button.small {
        width: auto;
        padding: 4px 8px;
        font-size: 0.74rem;
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
        color: #7dd3fc;
        outline: none;
      }
      .upload-status {
        margin-top: 6px;
        font-size: 0.75rem;
      }
      .setup-card {
        display: none;
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid #38bdf8;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 0.8rem;
      }
      .setup-card.visible {
        display: block;
      }
      .setup-card h2 {
        margin: 0 0 4px;
        font-size: 0.9rem;
        color: #e0f2fe;
      }
      .setup-card p {
        margin: 0 0 10px;
        font-size: 0.75rem;
        color: #94a3b8;
      }
      .setup-status {
        margin-top: 8px;
        font-size: 0.75rem;
      }
      .setup-status.ok {
        color: #86efac;
      }
      .setup-status.err {
        color: #fca5a5;
      }
      .jimaku-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .jimaku-row input {
        margin-bottom: 0;
      }
      .jimaku-list {
        max-height: 145px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 8px;
      }
      .jimaku-item {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 8px;
        text-align: left;
        cursor: pointer;
        font-size: 0.74rem;
        color: #e2e8f0;
      }
      .jimaku-item:hover {
        border-color: #475569;
      }
      .jimaku-item.active {
        border-color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
      }
      .jimaku-item.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .jimaku-item.dimmed {
        opacity: 0.7;
      }
      .jimaku-sub {
        color: #94a3b8;
        font-size: 0.69rem;
        margin-top: 2px;
        word-break: break-all;
      }
      .jimaku-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 3px;
      }
      .tag {
        font-size: 0.64rem;
        padding: 1px 5px;
        border-radius: 4px;
        background: #1e293b;
        color: #94a3b8;
        font-weight: 600;
      }
      .tag.rec {
        background: rgba(34, 197, 94, 0.18);
        color: #86efac;
      }
      .tag.web {
        background: rgba(56, 189, 248, 0.18);
        color: #7dd3fc;
      }
      .tag.warn {
        background: rgba(245, 158, 11, 0.18);
        color: #fcd34d;
      }
      input[type='password'] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
        margin-bottom: 8px;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Sensei</h1>
      <span id="health-badge" class="badge offline">Checking...</span>
    </div>

    <div id="setup-card" class="setup-card">
      <h2>Connect to your Sensei server</h2>
      <p>Enter your home server's Tailscale URL (e.g. http://homeserver:8000) and API token.</p>
      <form id="setup-form">
        <label for="setup-server-url">Server URL</label>
        <input
          id="setup-server-url"
          type="text"
          placeholder="http://homeserver:8000"
          required
        />
        <label for="setup-api-token">API Token (SENSEI_API_TOKEN)</label>
        <input
          id="setup-api-token"
          type="password"
          placeholder="Paste token if server auth is enabled"
        />
        <button type="submit" class="primary">Test &amp; Connect</button>
        <div id="setup-status" class="setup-status"></div>
      </form>
    </div>

    <div class="panel">
      <div class="toggle-row">
        <span>Overlay on this tab</span>
        <input id="tab-enable-toggle" type="checkbox" />
      </div>
      <div class="toggle-row">
        <span>Auto-pause after each line</span>
        <input id="auto-pause-toggle" type="checkbox" />
      </div>
      <div class="row" style="margin-bottom: 8px">
        <span class="muted">Page URL</span>
        <span id="page-pattern-text" class="pattern-pill">-</span>
      </div>

      <div id="suggest-banner" class="suggest-banner">
        <span id="suggest-text"></span>
        <button id="apply-suggest-btn" type="button" class="primary small">Attach</button>
      </div>

      <label for="episode-search">Find Episode</label>
      <input
        id="episode-search"
        type="text"
        placeholder="Filter by anime or episode..."
      />

      <label for="episode-select">Attached Episode (remembered for this URL)</label>
      <select id="episode-select">
        <option value="">None (detached)</option>
      </select>

      <button
        id="prime-episode-btn"
        type="button"
        class="primary"
        style="display: none; margin-top: 4px"
      >
        Pre-Watch Primer (Top 10 Words)
      </button>
    </div>

    <div class="panel">
      <details id="jimaku-details">
        <summary>Search Jimaku.cc Subtitles</summary>
        <div style="margin-top: 10px">
          <form id="jimaku-search-form" class="jimaku-row">
            <input
              id="jimaku-query"
              type="text"
              placeholder="Anime title (e.g. Frieren)"
              required
            />
            <button type="submit" class="primary small">Search</button>
          </form>
          <div id="jimaku-entries" class="jimaku-list"></div>
          <div id="jimaku-files-section" style="display: none">
            <div class="jimaku-row" style="align-items: center">
              <input
                id="jimaku-ep-num"
                type="number"
                step="0.5"
                min="0"
                placeholder="Ep #"
                style="width: 84px; flex-shrink: 0"
              />
              <button id="jimaku-refetch-files-btn" type="button" class="small">
                List Files
              </button>
            </div>
            <div id="jimaku-files" class="jimaku-list"></div>
            <button id="jimaku-import-btn" type="button" class="primary" disabled>
              Import &amp; Attach to Tab
            </button>
          </div>
          <div id="jimaku-status" class="upload-status muted"></div>
        </div>
      </details>
    </div>

    <div class="panel">
      <details id="upload-details">
        <summary>+ Upload JP Subtitle (.srt / .ass)</summary>
        <form id="upload-form" style="margin-top: 10px">
          <label for="upload-anime">Anime Title</label>
          <input id="upload-anime" type="text" placeholder="e.g. Frieren" required />
          <label for="upload-ep-num">Episode Number</label>
          <input id="upload-ep-num" type="number" step="0.5" placeholder="e.g. 1" />
          <label for="upload-file">Subtitle File</label>
          <input
            id="upload-file"
            type="file"
            accept=".srt,.ass,.ssa,.vtt"
            required
          />
          <button type="submit" class="primary">Upload &amp; Attach to Tab</button>
          <div id="upload-status" class="upload-status muted"></div>
        </form>
      </details>
    </div>

    <div class="panel">
      <div class="row">
        <span class="muted">Server</span>
        <span id="server-url-text">-</span>
      </div>
      <div class="row">
        <span class="muted">JMdict</span>
        <span id="dict-text">-</span>
      </div>
    </div>

    <div class="panel">
      <div class="muted" style="margin-bottom: 6px; font-weight: 600">Hotkeys</div>
      <div id="hotkey-summary"></div>
    </div>

    <button id="open-options-btn" type="button">Options &amp; Token</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
