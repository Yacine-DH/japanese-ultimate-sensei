<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-label="Architecture: the laptop extension calls the home server over Tailscale; the server fetches subtitles from Jimaku and sends translation batches and audio to Ollama and whisper-server on the GPU laptop.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<rect x="6" y="84" width="968" height="268" rx="16" fill="none" stroke="#afb8c1" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="22" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start">TAILSCALE TAILNET · bearer token on every call</text>
<rect x="375" y="8" width="230" height="46" rx="10" fill="#ffffff" stroke="#afb8c1" stroke-width="1.2"/>
<text x="490" y="28" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" fill-opacity="1.0" text-anchor="middle">Jimaku API</text>
<text x="490" y="45" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="middle">Japanese subtitle files</text>
<line x1="490" y1="118" x2="490" y2="58" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/>
<text x="500" y="74" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start">search + download</text>
<rect x="20" y="118" width="230" height="214" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/><text x="36" y="146" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" fill-opacity="1.0" text-anchor="start">Laptop · Edge</text><text x="36" y="165" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start">where you watch</text><text x="36" y="196" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">Sensei browser extension</text><text x="36" y="218" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">WXT · Manifest V3 · TypeScript</text><text x="36" y="240" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">overlay · capture · auto-sync</text><text x="36" y="262" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">Anki via AnkiConnect</text><text x="36" y="284" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">web app in any browser</text>
<rect x="375" y="118" width="230" height="214" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/><text x="391" y="146" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" fill-opacity="1.0" text-anchor="start">Home server</text><text x="391" y="165" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start">always on · no GPU · :8000</text><text x="391" y="196" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">FastAPI · Python 3.12 · uv</text><text x="391" y="218" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">SQLite · SQLModel · Alembic</text><text x="391" y="240" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">SudachiPy · JMdict · wordfreq</text><text x="391" y="262" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">ffmpeg · FSRS · webrtcvad</text><text x="391" y="284" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="start">serves the React web app</text>
<rect x="730" y="118" width="230" height="214" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="746" y="146" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" fill-opacity="1.0" text-anchor="start">GPU laptop</text><text x="746" y="165" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start">Dell Precision · ~4 GB VRAM</text><text x="746" y="196" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" fill-opacity="1.0" text-anchor="start">Ollama :11434</text><text x="746" y="218" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#c0392b" fill-opacity="1.0" text-anchor="start">gemma3:4b</text><text x="746" y="240" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start"></text><text x="746" y="262" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" fill-opacity="1.0" text-anchor="start">whisper-server :8080</text><text x="746" y="284" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#59636e" fill-opacity="1.0" text-anchor="start">large-v3-turbo q5_0 (planned)</text>
<line x1="252" y1="200" x2="371" y2="200" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/>
<text x="311" y="191" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="middle">API calls</text>
<line x1="371" y1="248" x2="254" y2="248" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/>
<text x="311" y="239" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="middle">furigana lines,</text>
<text x="311" y="266" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="middle">translations, media</text>
<line x1="607" y1="210" x2="726" y2="210" stroke="#c0392b" stroke-width="1.7" marker-end="url(#b)"/>
<text x="666" y="201" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="middle">12 lines → JSON</text>
<line x1="607" y1="276" x2="726" y2="276" stroke="#1f2328" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="666" y="267" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2328" fill-opacity="1.0" text-anchor="middle">16 kHz WAV → SRT</text>
</svg>