[project]
name = "sensei-server"
version = "0.1.0"
description = "Japanese Ultimate Sensei — home-server backend (subtitles, NLP, dictionary, SRS)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pysubs2>=1.7",
  "sudachipy>=0.6.8",
  "sudachidict-core>=20240716",
  "pykakasi>=2.3",
  "httpx>=0.27",
  "fsrs>=6.3.3",
  "alembic>=1.20.1",
  "genanki>=0.13.1",
  "zstandard>=0.25.0",
  "wordfreq[mecab]>=3.1.1",
  "webrtcvad-wheels>=2.0.14.post1",
  "sherpa-onnx>=2.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # formatter owns line length; wide Japanese chars trip E501

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
