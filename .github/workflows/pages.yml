# Builds and tests the public website. Publishing is always a deliberate, manual step.
name: Website

on:
  pull_request:
    paths: ['site/**', 'web/public/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages (public)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Fetch the latest extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'sensei-extension-*.zip' --dir site/downloads
      - name: Build and test
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SITE_REPO_PUBLIC: ${{ github.event.repository.private && '0' || '1' }}
        run: |
          pnpm install --frozen-lockfile
          node build.mjs
          pnpm test
      - if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
